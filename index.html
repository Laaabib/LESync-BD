    <script>
      // Safeguard window.fetch against "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _origFetch = window.fetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                     (window.Window && Object.getOwnPropertyDescriptor(window.Window.prototype, 'fetch')) ||
                     Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
          if (!desc || !desc.set) {
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return _origFetch; },
                set: function(fn) { _origFetch = fn; },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {
              try {
                var proto = Object.getPrototypeOf(window);
                if (proto) {
                  Object.defineProperty(proto, 'fetch', {
                    get: function() { return _origFetch; },
                    set: function(fn) { _origFetch = fn; },
                    configurable: true,
                    enumerable: true
                  });
                }

            }
          }
